[package]
name = "pixelforge"
version = "0.1.0"
edition = "2021"
description = "Image compressor and converter in Rust, compiled to WebAssembly. Runs 100% in the browser."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
zip = { version = "9", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
